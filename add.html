<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielcodes</title>
    <link rel="icon" type"image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>


<body>
    <h1 id="headline">Mannschaft hinzufügen</h1>
    <div class="container">
        <div class="settings-container" id="add-team-page">
            <ul class="settings-list">
                <li>
                    <span>Spielcodes</span>
                    <label for="uploadCodes" class="custom-file-button" id="spielcodes-button">Datei Auswählen</label>
                    <input type="file" id="uploadCodes" style=" display: none;" accept="application/pdf" multiple>
                </li>
                <li>
                    <span>Spielpins</span>
                    <label for="uploadPins" class="custom-file-button" id="spielpins-button">Datei Auswählen</label>
                    <input type="file" id="uploadPins" style=" display: none;" accept="application/pdf" multiple>
                </li>
            </ul>
        </div>
        <div class="center">
            <button onclick="closeAdd()">Abbrechen</button>
            <button onclick="addTeam()">Mannschaft hinzufügen</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.10.111/pdf.min.js"></script>
    <script src="scripts/add.js"></script>
</body>
<div id="verificationModalEdit" class="modal">
    <div class="modal-content">
        <h2 id="verification-headline-edit">Mannschaft aktualisieren?</h2>
        <div class="modal-buttons">
            <button id="verificationModalEditAbbrechen" onclick="backToEdit()">Abbrechen</button>
            <button id="verificationModalEditJa" onclick="updateTeam()">Aktualisieren</button>
        </div>
    </div>
</div>
</html>
